<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 대시보드</title>
    <script>
        // [보안] 로그인 여부 및 사용자 아이디 확인
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            alert("⛔ 잘못된 접근입니다. 비밀번호를 먼저 입력해주세요!");
            window.location.href = "index.html";
        }        
        const loggedInUser = sessionStorage.getItem("username") || "";
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex; flex-direction: row; height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #333;
        }
        /* 사이드바 */
        .sidebar {
            width: 250px; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);
            padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; color: white;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; }
        .menu-item { padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s ease; }
        .menu-item:hover, .menu-item.active { background: rgba(255, 255, 255, 0.4); color: #111; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        /* 메인 영역 */
        .main-content { flex: 1; padding: 40px 20px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
        .section-container { width: 100%; display: none; justify-content: center; } /* 모든 섹션 초기 숨김 */
        .box { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 16px; padding: 30px 20px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
        h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin-bottom: 10px; color: #2c3e50; text-align: center; }
        .table-container { width: 100%; max-height: 50vh; overflow-y: auto; border-radius: 8px; border: 1px solid #ddd; background: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
        .bus-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 6px solid #43e97b; display: flex; justify-content: space-between; align-items: center; }
        .arrive-first { font-size: 1.4rem; font-weight: bold; color: #e74c3c; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .blink { animation: blink 1s infinite; }
        .update-time { text-align: right; font-size: 0.8rem; color: #aaa; margin-top: 10px; }
        
        /* 치이카와 게임 스타일 */
        #game-container { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            height: 500px; 
            margin: 20px auto; 
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #FFB6C1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            touch-action: none;
        }
        .chiikawa {
            position: absolute;
            font-size: 50px;
            transition: left 0.1s;
            user-select: none;
        }
        .item {
            position: absolute;
            font-size: 35px;
            animation: fall linear;
            user-select: none;
        }
        @keyframes fall {
            to { top: 100%; }
        }
        .game-score {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 15px 0;
            color: #ff69b4;
        }
        .game-controls {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.9rem;
        }
        .btn-control {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px 5px;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4);
            color: white;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 10px rgba(255,105,180,0.3);
            transition: transform 0.1s;
        }
        .btn-control:active {
            transform: scale(0.95);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
        }
        #game-over h2 {
            color: #ff69b4;
            margin-bottom: 15px;
        }
        #restart-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; padding: 15px; overflow-x: auto; }
            .sidebar h2 { display: none; }
            #game-container { height: 400px; }
        }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar-nav">
        <h2>대시보드</h2>
        <div class="menu-item" id="menu-traffic08" onclick="showSection('traffic08')">🚌 교통현황 (성북08)</div>
        <div class="menu-item" id="menu-traffic09" onclick="showSection('traffic09')">🚍 교통현황 (성북09)</div>
    </nav>
    <main class="main-content">
        <div id="dynamic-content-area"></div>
        <!-- 성북08 섹션 -->
        <div id="section-traffic08" class="section-container">
            <div class="box">
                <h1>🚌 교통현황</h1>
                <p style="text-align:center; margin-bottom:20px;">📍 기준: <strong>길음역</strong> (성북08)</p>
                <div id="bus-arrive-wrap08"></div>
                <p class="update-time" id="update-time08"></p>
            </div>
        </div>
        <!-- 성북09 섹션 -->
        <div id="section-traffic09" class="section-container">
            <div class="box">
                <h1>🚍 교통현황</h1>
                <p style="text-align:center; margin-bottom:20px;">📍 기준: <strong>길음역</strong> (성북09)</p>
                <div id="bus-arrive-wrap09"></div>
                <p class="update-time" id="update-time09"></p>
            </div>
        </div>
    </main>
    <script>
        // --- 동적 렌더링 함수 (일반 사용자 전용) ---
        function renderContactElements() {
            const sidebar = document.getElementById('sidebar-nav');
            const contactBtn = document.createElement('div');
            contactBtn.className = 'menu-item';
            contactBtn.id = 'menu-contact';
            contactBtn.innerText = '📞 연락처';
            contactBtn.onclick = () => showSection('contact');
            sidebar.insertBefore(contactBtn, document.getElementById('menu-traffic08'));
            
            const dynamicArea = document.getElementById('dynamic-content-area');
            dynamicArea.innerHTML = `
                <div id="section-contact" class="section-container">
                    <div class="box">
                        <h1>📞 연락처</h1>
                        <div class="table-container">
                            <table>
                                <thead><tr><th>번호</th><th>내용</th><th>Tel</th></tr></thead>
                                <tbody id="table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- kgw 전용 치이카와 게임 렌더링 ---
        function renderGameElements() {
            const sidebar = document.getElementById('sidebar-nav');
            const gameBtn = document.createElement('div');
            gameBtn.className = 'menu-item';
            gameBtn.id = 'menu-game';
            gameBtn.innerText = '🎮 치이카와 게임';
            gameBtn.onclick = () => showSection('game');
            sidebar.appendChild(gameBtn);
            
            const dynamicArea = document.getElementById('dynamic-content-area');
            dynamicArea.innerHTML = `
                <div id="section-game" class="section-container">
                    <div class="box">
                        <h1>🐹 치이카와 아이템 캐치</h1>
                        <div class="game-score">점수: <span id="score">0</span></div>
                        <div id="game-container">
                            <div class="chiikawa" id="player">🐹</div>
                            <div id="game-over">
                                <h2>게임 종료!</h2>
                                <p style="font-size:1.2rem; margin:10px 0;">최종 점수: <span id="final-score">0</span></p>
                                <button id="restart-btn" onclick="restartGame()">다시 시작</button>
                            </div>
                        </div>
                        <div style="text-align:center; margin-top:15px;">
                            <div class="btn-control" id="btn-left">⬅️ 왼쪽</div>
                            <div class="btn-control" id="btn-right">오른쪽 ➡️</div>
                        </div>
                        <div class="game-controls">
                            🍎사과 +10점 | 💎보석 +30점 | 💣폭탄 게임오버<br>
                            PC: 화살표 키 | 모바일: 버튼 터치
                        </div>
                    </div>
                </div>
            `;
        }

        // 🔄 섹션 전환 함수
        function showSection(sectionId) {
            document.querySelectorAll('.section-container').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            
            const targetSection = document.getElementById("section-" + sectionId);
            const targetMenu = document.getElementById("menu-" + sectionId);
            if (targetSection && targetMenu) {
                targetSection.style.display = "flex";
                targetMenu.classList.add("active");
            }
            
            if (sectionId === 'contact') loadData();
            if (sectionId === 'traffic08') loadBusArrive08();
            if (sectionId === 'traffic09') loadBusArrive09();
            if (sectionId === 'game') initGame();
        }

        // 🏁 초기화 로직
        window.addEventListener('DOMContentLoaded', () => {
            if (loggedInUser === "kgw") {
                renderGameElements();
                showSection('traffic08');
            } else {
                renderContactElements();
                showSection('contact');
            }
        });

        // --- 데이터 로드 함수 ---
        async function loadData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                const tableBody = document.getElementById('table-body');
                if(!tableBody) return;
                tableBody.innerHTML = data.map(item => `
                    <tr><td>${item.id}</td><td>${item.content1}</td>
                    <td><a href="tel:${item.content2}" style="color:#0056b3; font-weight:bold;">${item.content2}</a></td></tr>
                `).join('');
            } catch (e) { console.error("연락처 로드 실패"); }
        }
        
        async function loadBusArrive08() {
            const wrap = document.getElementById('bus-arrive-wrap08');
            wrap.innerHTML = '<div style="text-align:center;">⏳ 로딩 중...</div>';
            try {
                const response = await fetch('/api/bus');
                const data = await response.json();
                renderBusInfo(data, wrap, "성북08", "길음역 → 신안아파트 방향");
                document.getElementById('update-time08').innerText = "마지막 갱신: " + new Date().toLocaleTimeString();
            } catch (e) { wrap.innerHTML = "데이터를 불러올 수 없습니다."; }
        }
        
        async function loadBusArrive09() {
            const wrap = document.getElementById('bus-arrive-wrap09');
            wrap.innerHTML = '<div style="text-align:center;">⏳ 로딩 중...</div>';
            try {
                const response = await fetch('/api/bus09');
                const data = await response.json();
                renderBusInfo(data, wrap, "성북09", "길음역 → 신안아파트 방향");
                document.getElementById('update-time09').innerText = "마지막 갱신: " + new Date().toLocaleTimeString();
            } catch (e) { wrap.innerHTML = "데이터를 불러올 수 없습니다."; }
        }
        
        function renderBusInfo(data, wrap, busNm, dir) {
            if (data.msgBody && data.msgBody.itemList) {
                wrap.innerHTML = data.msgBody.itemList.map(bus => {
                    const isUrgent = bus.arrmsg1.includes("곧") || bus.arrmsg1.includes("0분");
                    return `
                        <div class="bus-card">
                            <div><div style="font-size:1.2rem;font-weight:bold;">${busNm}</div><div style="font-size:0.8rem;color:#888;">${dir}</div></div>
                            <div style="text-align:right;">
                                <div class="arrive-first ${isUrgent ? 'blink' : ''}">🟢 ${bus.arrmsg1}</div>
                                <div style="font-size:0.9rem;color:#555;">🔵 ${bus.arrmsg2}</div>
                            </div>
                        </div>`;
                }).join('');
            } else { wrap.innerHTML = "도착 정보가 없습니다."; }
        }

        // 30초마다 자동 갱신
        setInterval(() => {
            if (document.getElementById('section-traffic08').style.display !== 'none') loadBusArrive08();
            if (document.getElementById('section-traffic09').style.display !== 'none') loadBusArrive09();
        }, 30000);

        // ===== 치이카와 아이템 캐치 게임 =====
        let gameInterval, itemInterval;
        let score = 0, gameRunning = false;
        let playerPos = 50;
        
        function initGame() {
            score = 0;
            playerPos = 50;
            gameRunning = true;
            document.getElementById('score').innerText = score;
            document.getElementById('game-over').style.display = 'none';
            document.querySelectorAll('.item').forEach(item => item.remove());
            
            const player = document.getElementById('player');
            if (!player) return;
            
            player.style.left = '50%';
            player.style.bottom = '20px';
            
            // 아이템 생성
            clearInterval(itemInterval);
            itemInterval = setInterval(createItem, 1200);
            
            // 키보드 이벤트
            document.addEventListener('keydown', handleKeyPress);
            
            // 모바일 버튼 이벤트
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            
            if (btnLeft && btnRight) {
                btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); movePlayer(-15); });
                btnLeft.addEventListener('click', () => movePlayer(-15));
                btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); movePlayer(15); });
                btnRight.addEventListener('click', () => movePlayer(15));
            }
        }
        
        function createItem() {
            if (!gameRunning) return;
            
            const container = document.getElementById('game-container');
            if (!container) return;
            
            const item = document.createElement('div');
            item.className = 'item';
            
            const items = [
                {emoji: '🍎', score: 10, type: 'good'},
                {emoji: '💎', score: 30, type: 'good'},
                {emoji: '🍪', score: 20, type: 'good'},
                {emoji: '🍰', score: 15, type: 'good'},
                {emoji: '💣', score: -999, type: 'bad'}
            ];
            
            const selected = items[Math.floor(Math.random() * items.length)];
            item.innerText = selected.emoji;
            item.dataset.score = selected.score;
            item.dataset.type = selected.type;
            
            item.style.left = Math.random() * 85 + '%';
            item.style.top = '-50px';
            item.style.animationDuration = (2 + Math.random() * 2) + 's';
            
            container.appendChild(item);
            
            const checkCollision = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(checkCollision);
                    return;
                }
                
                const itemRect = item.getBoundingClientRect();
                const player = document.getElementById('player');
                if (!player) return;
                const playerRect = player.getBoundingClientRect();
                
                if (itemRect.bottom > playerRect.top &&
                    itemRect.top < playerRect.bottom &&
                    itemRect.right > playerRect.left &&
                    itemRect.left < playerRect.right) {
                    
                    const points = parseInt(item.dataset.score);
                    if (item.dataset.type === 'bad') {
                        endGame();
                    } else {
                        score += points;
                        document.getElementById('score').innerText = score;
                    }
                    item.remove();
                    clearInterval(checkCollision);
                }
                
                if (itemRect.top > window.innerHeight) {
                    item.remove();
                    clearInterval(checkCollision);
                }
            }, 50);
        }
        
        function handleKeyPress(e) {
            if (!gameRunning) return;
            if (e.key === 'ArrowLeft') movePlayer(-15);
            if (e.key === 'ArrowRight') movePlayer(15);
        }
        
        function movePlayer(delta) {
            if (!gameRunning) return;
            playerPos = Math.max(0, Math.min(100, playerPos + delta));
            const player = document.getElementById('player');
            if (player) player.style.left = playerPos + '%';
        }
        
        function endGame() {
            gameRunning = false;
            clearInterval(itemInterval);
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }
        
        function restartGame() {
            initGame();
        }
    </script>
</body>
</html>
