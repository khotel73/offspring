<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사내 대시보드</title>
    <script>
        // [보안] 로그인 여부 및 사용자 아이디 확인
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            alert("⛔ 잘못된 접근입니다. 비밀번호를 먼저 입력해주세요!");
            window.location.href = "index.html";
        }
        const loggedInUser = sessionStorage.getItem("username") || "";
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex; flex-direction: row; height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #333;
        }
        /* 사이드바 */
        .sidebar {
            width: 250px; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);
            padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; color: white;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; }
        .menu-item { padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s ease; }
        .menu-item:hover, .menu-item.active { background: rgba(255, 255, 255, 0.4); color: #111; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* 중요: kgw 사용자를 위해 연락처 메뉴를 기본적으로 숨김 */
        #menu-contact { display: none; } 
        /* 일반 사용자는 아래 JS에서 다시 보이게 처리함 */

        /* 메인 영역 */
        .main-content { flex: 1; padding: 40px 20px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
        .section-container { width: 100%; display: none; justify-content: center; } /* 모든 섹션 초기 숨김 */
        
        .box { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 16px; padding: 30px 20px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
        h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin-bottom: 10px; color: #2c3e50; text-align: center; }
        .table-container { width: 100%; max-height: 50vh; overflow-y: auto; border-radius: 8px; border: 1px solid #ddd; background: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; position: sticky; top: 0; }
        .bus-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 6px solid #43e97b; display: flex; justify-content: space-between; align-items: center; }
        .arrive-first { font-size: 1.4rem; font-weight: bold; color: #e74c3c; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .blink { animation: blink 1s infinite; }
        .update-time { text-align: right; font-size: 0.8rem; color: #aaa; margin-top: 10px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; padding: 15px; overflow-x: auto; }
            .sidebar h2 { display: none; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2>대시보드</h2>
        <!-- 연락처 메뉴는 기본적으로 CSS에서 display: none 상태임 -->
        <div class="menu-item" id="menu-contact" onclick="showSection('contact')">📞 연락처</div>
        <div class="menu-item" id="menu-traffic08" onclick="showSection('traffic08')">🚌 교통현황 (성북08)</div>
        <div class="menu-item" id="menu-traffic09" onclick="showSection('traffic09')">🚍 교통현황 (성북09)</div>
    </nav>

    <main class="main-content">
        <!-- 연락처 섹션 -->
        <div id="section-contact" class="section-container">
            <div class="box">
                <h1>📞 연락처</h1>
                <div class="table-container">
                    <table>
                        <thead><tr><th>번호</th><th>내용</th><th>Tel</th></tr></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 성북08 섹션 -->
        <div id="section-traffic08" class="section-container">
            <div class="box">
                <h1>🚌 교통현황</h1>
                <p style="text-align:center; margin-bottom:20px;">📍 기준: <strong>길음역</strong> (성북08)</p>
                <div id="bus-arrive-wrap08"></div>
                <p class="update-time" id="update-time08"></p>
            </div>
        </div>

        <!-- 성북09 섹션 -->
        <div id="section-traffic09" class="section-container">
            <div class="box">
                <h1>🚍 교통현황</h1>
                <p style="text-align:center; margin-bottom:20px;">📍 기준: <strong>길음역</strong> (성북09)</p>
                <div id="bus-arrive-wrap09"></div>
                <p class="update-time" id="update-time09"></p>
            </div>
        </div>
    </main>

    <script>
        // 🔄 섹션 전환 함수
        function showSection(sectionId) {
            // kgw 사용자가 강제로 contact에 접근하려 할 경우 차단
            if (loggedInUser === "kgw" && sectionId === 'contact') return;

            // 모든 섹션 숨김 및 메뉴 비활성화
            document.querySelectorAll('.section-container').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));

            // 타겟 섹션 및 메뉴 활성화
            const targetSection = document.getElementById("section-" + sectionId);
            const targetMenu = document.getElementById("menu-" + sectionId);
            
            if (targetSection && targetMenu) {
                targetSection.style.display = "flex";
                targetMenu.classList.add("active");
            }

            // 데이터 호출
            if (sectionId === 'contact') loadData();
            if (sectionId === 'traffic08') loadBusArrive08();
            if (sectionId === 'traffic09') loadBusArrive09();
        }

        // 🏁 초기화 로직
        window.addEventListener('DOMContentLoaded', () => {
            if (loggedInUser === "kgw") {
                // kgw일 경우: 연락처 메뉴는 계속 숨겨진 상태(CSS) 유지
                // 첫 화면을 교통현황으로 설정
                showSection('traffic08');
            } else {
                // 일반 사용자일 경우: 숨겨진 연락처 메뉴를 보이게 처리
                document.getElementById("menu-contact").style.display = "block";
                showSection('contact');
            }
        });

        // --- 데이터 로드 함수 (기존과 동일) ---
        async function loadData() {
            if (loggedInUser === "kgw") return;
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                const tableBody = document.getElementById('table-body');
                tableBody.innerHTML = data.map(item => `
                    <tr><td>${item.id}</td><td>${item.content1}</td>
                    <td><a href="tel:${item.content2}" style="color:#0056b3; font-weight:bold;">${item.content2}</a></td></tr>
                `).join('');
            } catch (e) { console.error("연락처 로드 실패"); }
        }

        async function loadBusArrive08() {
            const wrap = document.getElementById('bus-arrive-wrap08');
            wrap.innerHTML = '<div style="text-align:center;">⏳ 로딩 중...</div>';
            try {
                const response = await fetch('/api/bus');
                const data = await response.json();
                renderBusInfo(data, wrap, "성북08", "길음역 → 신안아파트");
                document.getElementById('update-time08').innerText = "마지막 갱신: " + new Date().toLocaleTimeString();
            } catch (e) { wrap.innerHTML = "데이터를 불러올 수 없습니다."; }
        }

        async function loadBusArrive09() {
            const wrap = document.getElementById('bus-arrive-wrap09');
            wrap.innerHTML = '<div style="text-align:center;">⏳ 로딩 중...</div>';
            try {
                const response = await fetch('/api/bus09');
                const data = await response.json();
                renderBusInfo(data, wrap, "성북09", "길음역 → 성북09 방향");
                document.getElementById('update-time09').innerText = "마지막 갱신: " + new Date().toLocaleTimeString();
            } catch (e) { wrap.innerHTML = "데이터를 불러올 수 없습니다."; }
        }

        function renderBusInfo(data, wrap, busNm, dir) {
            if (data.msgBody && data.msgBody.itemList) {
                wrap.innerHTML = data.msgBody.itemList.map(bus => {
                    const isUrgent = bus.arrmsg1.includes("곧") || bus.arrmsg1.includes("0분");
                    return `
                        <div class="bus-card">
                            <div><div style="font-size:1.2rem;font-weight:bold;">${busNm}</div><div style="font-size:0.8rem;color:#888;">${dir}</div></div>
                            <div style="text-align:right;">
                                <div class="arrive-first ${isUrgent ? 'blink' : ''}">🟢 ${bus.arrmsg1}</div>
                                <div style="font-size:0.9rem;color:#555;">🔵 ${bus.arrmsg2}</div>
                            </div>
                        </div>`;
                }).join('');
            } else { wrap.innerHTML = "도착 정보가 없습니다."; }
        }

        // 30초마다 자동 갱신
        setInterval(() => {
            if (document.getElementById('section-traffic08').style.display !== 'none') loadBusArrive08();
            if (document.getElementById('section-traffic09').style.display !== 'none') loadBusArrive09();
        }, 30000);
    </script>
</body>
</html>
